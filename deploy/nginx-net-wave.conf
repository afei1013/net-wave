# net-wave 反向代理配置（模板）
# 域名占位符 net-wave.example.com 会被 deploy/enable-site.sh 自动替换；
# 手动部署时请全局替换为你的域名。

# WebSocket 升级映射：map 是 http 块级指令，
# Debian/Ubuntu 的 sites-enabled 与 RHEL 系的 conf.d 均位于 http 上下文内，可直接放置。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP(80)：证书续期验证 + 全量跳转 HTTPS ----------
server {
    listen 80;
    server_name net-wave.example.com;

    # certbot webroot 续期验证（证书每 90 天自动续期依赖此块，勿删）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS(443)：反代到本机 net-wave 容器 ----------
server {
    listen 443 ssl http2;
    server_name net-wave.example.com;

    # 证书路径由 enable-site.sh 经 certbot 签发生成（密钥文件名为 privkey.pem）
    ssl_certificate     /etc/letsencrypt/live/net-wave.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/net-wave.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 强制浏览器后续访问走 HTTPS（确认只用此域名访问时可保留）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上传文件大小上限（业务含文件消息传输）
    client_max_body_size 512m;

    # WebSocket 长连接与文件传输的宽松超时；流式响应不缓冲
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 升级（/ws 端点必需）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 真实客户端信息透传（server.ts 依据 X-Forwarded-For 记录节点 IP）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
